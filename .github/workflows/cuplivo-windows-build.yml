name: Cuplivo Windows Build

# 在用户自己的 fork 上运行，直接拉取 cuplivo/cuplivo 公开源码构建 Windows 安装包，
# 不消耗 cuplivo/cuplivo 上游仓库的 Actions 配额。

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      # 要构建的 Cuplivo 版本（tag 或分支）
      cuplivo_ref:
        description: 'Cuplivo 版本（tag 或分支，如 v2.7.0 / master）'
        required: false
        default: 'v2.7.0'
        type: string

jobs:
  windows:
    name: 构建 Windows setup
    runs-on: windows-latest
    permissions: write-all

    steps:
      - name: 📦 检出 Cuplivo 源码
        uses: actions/checkout@v4
        with:
          repository: cuplivo/cuplivo
          ref: ${{ github.event.inputs.cuplivo_ref }}

      - name: 🔧 安装最新 CMake
        uses: lukka/get-cmake@latest

      - name: 🐦 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: 🔧 获取依赖
        run: flutter pub get

      - name: 📝 获取版本号
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern "version:" | ForEach-Object { $_.Line.Split(":")[1].Trim() })
          $shortSha = git rev-parse --short HEAD
          $version = "$version`_$shortSha"
          echo "VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "版本号: $version"

      - name: 🏗️ 构建 Windows
        run: flutter build windows --release

      - name: 📦 打包 ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "Cuplivo_windows_$env:VERSION.zip"

      - name: 🔧 安装 Inno Setup
        run: choco install innosetup -y

      - name: 📦 创建安装程序
        shell: pwsh
        run: |
          # 语言文件检测（中文语言包在部分 Runner 缺失，避免编译失败）
          $zhLangCompiler = "C:\\Program Files (x86)\\Inno Setup 6\\Languages\\ChineseSimplified.isl"
          $zhLangLocalDir = Join-Path (Get-Location) "Languages"
          $zhLangLocal = Join-Path $zhLangLocalDir "ChineseSimplified.isl"
          $languagesBlock = $null
          if (Test-Path $zhLangCompiler) {
            Write-Host "✅ 检测到中文语言文件: $zhLangCompiler"
            $languagesBlock = @"
          [Languages]
          Name: "chinesesimplified"; MessagesFile: "compiler:Languages\ChineseSimplified.isl"
          Name: "english"; MessagesFile: "compiler:Default.isl"
          "@
          } else {
            Write-Host "⚠️ 未在 Inno Setup 安装目录找到中文语言文件，尝试下载到本地项目..."
            try {
              New-Item -ItemType Directory -Force -Path $zhLangLocalDir | Out-Null
              $uri = 'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl'
              Invoke-WebRequest -Uri $uri -OutFile $zhLangLocal -UseBasicParsing -TimeoutSec 60
              if (Test-Path $zhLangLocal) {
                Write-Host "✅ 已下载中文语言文件: $zhLangLocal"
                $languagesBlock = @"
          [Languages]
          Name: "chinesesimplified"; MessagesFile: "$zhLangLocal"
          Name: "english"; MessagesFile: "compiler:Default.isl"
          "@
              }
            } catch {
              Write-Host "⚠️ 下载中文语言文件失败: $($_.Exception.Message)"
            }
            if (-not $languagesBlock) {
              Write-Host "ℹ️ 将仅包含英文安装向导"
              $languagesBlock = @"
          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"
          "@
            }
          }
          # 创建 Inno Setup 脚本
          $issContent = @"
          #define MyAppName "Cuplivo"
          #define MyAppVersion "$env:VERSION"
          #define MyAppPublisher "Psyche"
          #define MyAppExeName "cuplivo.exe"
          [Setup]
          AppId={{3DB01FC7-0467-4D5B-A7BC-346083F29D7E}}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\{#MyAppName}
          DefaultGroupName={#MyAppName}
          OutputDir=.
          OutputBaseFilename=Cuplivo_windows_{#MyAppVersion}_setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesInstallIn64BitMode=x64
          ArchitecturesAllowed=x64
          UninstallDisplayIcon={app}\{#MyAppExeName}
          $languagesBlock
          [Tasks]
          Name: "desktopicon"; Description: "创建桌面快捷方式"; GroupDescription: "附加图标:"
          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{group}\卸载 {#MyAppName}"; Filename: "{uninstallexe}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon
          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "启动 {#MyAppName}"; Flags: nowait postinstall skipifsilent
          "@

          # 使用 UTF-8 BOM 以确保中文字符在 Inno Setup 中正确解析
          $issContent | Out-File -FilePath "installer.iss" -Encoding utf8BOM

          # 编译安装程序
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: 📏 记录产物体积
        shell: pwsh
        run: |
          $lines = @("### Windows sizes", '```')
          Get-ChildItem Cuplivo_windows_*.zip, Cuplivo_windows_*_setup.exe -ErrorAction SilentlyContinue |
            ForEach-Object { $lines += ("{0}`t{1:N1} MB" -f $_.Name, ($_.Length / 1MB)) }
          $lines += '```'
          $lines -join "`n" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: 📤 上传构建产物 (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: Windows-ZIP
          path: Cuplivo_windows_*.zip

      - name: 📤 上传构建产物 (Installer)
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: Cuplivo_windows_*_setup.exe
